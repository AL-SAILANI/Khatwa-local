name: Generate listening audio

# Manual run: records the mock-exam (2-5) listening clips with the free Edge
# TTS voices and opens a pull request with the MP3s and the updated manifest.
# Run it from the Actions tab -> "Generate listening audio" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          npm ci
          pip install edge-tts
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Generate MP3s
        run: python3 scripts/generate-listening-audio.py --mocks

      - name: Check results
        run: |
          count=$(grep -c '^  "' src/data/mock-listening-audio.ts || true)
          echo "clips with audio: $count"
          test "$count" -ge 30
          ls -la public/audio/listening | tail -5

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="audio/mock-listening-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/audio src/data/mock-listening-audio.ts
          git commit -m "Add recorded audio for mock exam listening clips"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Add recorded audio for mock exam listening clips" \
            --body "MP3s generated by scripts/generate-listening-audio.py --mocks (Edge TTS). After merging, the questions' audio_url must be updated in Supabase." \
            || echo "PR creation not allowed; open a PR from branch $branch manually."
